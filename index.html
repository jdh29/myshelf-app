<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1712" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="myshelf" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <title>myshelf</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; background: #0d1712; }
    body { overflow-x: hidden; }
    body { overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
    select option { background: #14251b; color: #efe6d2; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const STORAGE_KEY = "bookshelf_v1";

    const emptyBook = {
      id: null, title: "", author: "", pages: "", genre: "",
      year: "", publisher: "", isbn: "", description: "",
      status: "Unread", rating: 0, cover: null, spineImage: null, addedAt: null,
    };

    const resizeImage = (dataUrl, maxSize = 500) => new Promise((resolve) => {
      try {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let w = img.width, h = img.height;
          if (!w || !h) { resolve(dataUrl); return; }
          if (w > maxSize || h > maxSize) {
            if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
            else { w = Math.round(w * maxSize / h); h = maxSize; }
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          try { resolve(canvas.toDataURL("image/jpeg", 0.8)); }
          catch { resolve(dataUrl); }
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      } catch { resolve(dataUrl); }
    });

    async function lookupByISBN(isbn) {
      const clean = isbn.replace(/[^0-9Xx]/g, "");
      const res = await fetch(`/api/isbn?isbn=${clean}`);
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        throw new Error(e.error || "No book found for that barcode");
      }
      return await res.json();
    }

    function StarRating({ value, onChange }) {
      const [hovered, setHovered] = useState(0);
      return (
        <div style={{ display: "flex", gap: 4 }}>
          {[1,2,3,4,5].map(star => (
            <span key={star}
              onClick={() => onChange && onChange(star === value ? 0 : star)}
              onMouseEnter={() => onChange && setHovered(star)}
              onMouseLeave={() => onChange && setHovered(0)}
              style={{ fontSize: 22, cursor: onChange ? "pointer" : "default",
                color: star <= (hovered || value) ? "#d9b64e" : "#3c4a3f",
                transition: "color 0.15s", userSelect: "none" }}>★</span>
          ))}
        </div>
      );
    }

    function StatusBadge({ status }) {
      const colors = {
        "Unread":   { bg: "#2a2416", text: "#d9c47e", border: "#5c4a24" },
        "Reading":  { bg: "#16301f", text: "#7fc98d", border: "#2f5c3a" },
        "Finished": { bg: "#1b2a30", text: "#8fc4d8", border: "#2d4d5a" },
      };
      const c = colors[status] || colors["Unread"];
      return <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.06em",
        textTransform: "uppercase", padding: "3px 10px", borderRadius: 99,
        background: c.bg, color: c.text, border: `1px solid ${c.border}` }}>{status}</span>;
    }

    // Derive a stable spine colour from a book's title (used when no cover colour).
    const SPINE_PALETTE = [
      "#5c1f1f", "#1f3a5c", "#26402a", "#4a2f5c", "#5c4420",
      "#1f4a4a", "#5c2a3a", "#2f3a1f", "#3a2418", "#1f2f4a",
    ];
    function spineColorFor(book) {
      if (book.spineColor) return book.spineColor;
      const s = (book.title || "") + (book.author || "");
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return SPINE_PALETTE[h % SPINE_PALETTE.length];
    }
    // Vary height/width a little so the shelf looks natural, but stably per book.
    function spineDims(book) {
      const s = (book.title || "") + (book.id || "");
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 17 + s.charCodeAt(i)) >>> 0;
      const pages = parseInt(book.pages, 10);
      const widthBase = pages && !isNaN(pages)
        ? Math.max(24, Math.min(48, Math.round(pages / 14)))
        : 30 + (h % 14);
      return { w: widthBase, hPct: 88 + (h % 12) }; // height 88–99% of shelf
    }

    function Spine({ book, onClick }) {
      const col = spineColorFor(book);
      const { w, hPct } = spineDims(book);
      const title = (book.title || "Untitled");
      const shown = title.length > 26 ? title.slice(0, 25) + "…" : title;
      // If the user supplied a real spine photo, show that instead.
      if (book.spineImage) {
        return (
          <div onClick={onClick} title={title}
            style={{ width:w, height:`${hPct}%`, alignSelf:"flex-end", cursor:"pointer",
              borderRadius:"2px 3px 3px 2px", overflow:"hidden", flexShrink:0,
              boxShadow:"2px 3px 7px rgba(0,0,0,0.55)" }}>
            <img src={book.spineImage} alt={title}
              style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} />
          </div>
        );
      }
      return (
        <div onClick={onClick} title={title}
          style={{
            width: w, height: `${hPct}%`, alignSelf: "flex-end", flexShrink: 0,
            cursor: "pointer", position: "relative",
            borderRadius: "2px 3px 3px 2px",
            background: `linear-gradient(90deg, rgba(0,0,0,0.45) 0%, ${col} 18%, ${col} 72%, rgba(0,0,0,0.35) 100%)`,
            boxShadow: "2px 3px 7px rgba(0,0,0,0.55)",
            display: "flex", alignItems: "center", justifyContent: "center",
            overflow: "hidden",
          }}>
          {/* gilt bands top and bottom */}
          <div style={{ position:"absolute", top:"7%", left:3, right:3, height:2, background:"rgba(214,183,110,0.75)" }} />
          <div style={{ position:"absolute", top:"12%", left:3, right:3, height:1, background:"rgba(214,183,110,0.45)" }} />
          <div style={{ position:"absolute", bottom:"9%", left:3, right:3, height:2, background:"rgba(214,183,110,0.75)" }} />
          <div style={{ position:"absolute", bottom:"14%", left:3, right:3, height:1, background:"rgba(214,183,110,0.45)" }} />
          <div style={{
            writingMode: "vertical-rl", transform: "rotate(180deg)",
            color: "#e8dcb8", fontSize: w > 42 ? 12 : 10, fontWeight: 700,
            letterSpacing: "0.04em", whiteSpace: "nowrap",
            maxHeight: "72%", overflow: "hidden", textShadow: "0 1px 2px rgba(0,0,0,0.6)",
            fontFamily: "Georgia, 'Times New Roman', serif",
          }}>{shown}</div>
        </div>
      );
    }

    const BOOKEND_W = 38;   // rendered width of each bookend
    const SPINE_GAP = 3;
    const COVER_W   = 92;
    const COVER_GAP = 12;

    // One wooden shelf board with a row of books resting on it.
    function ShelfRow({ books, mode, onOpen, rowHeight, showEnds }) {
      return (
        <div>
          {mode === "spine" ? (
            <div style={{ display:"flex", alignItems:"flex-end", justifyContent:"flex-start",
              gap:SPINE_GAP, height:rowHeight, overflow:"hidden" }}>
              {showEnds && <img src="/bookend-l.png" alt=""
                style={{ width:BOOKEND_W, alignSelf:"flex-end", flexShrink:0, marginRight:-2 }} />}
              {books.map(b => <Spine key={b.id} book={b} onClick={() => onOpen(b)} />)}
              {showEnds && <img src="/bookend-r.png" alt=""
                style={{ width:BOOKEND_W, alignSelf:"flex-end", flexShrink:0, marginLeft:-2 }} />}
            </div>
          ) : (
            <div style={{ display:"flex", alignItems:"flex-end", gap:COVER_GAP,
              flexWrap:"nowrap", overflow:"hidden" }}>
              {books.map(b => (
                <div key={b.id} onClick={() => onOpen(b)} style={{ width:COVER_W, flexShrink:0, cursor:"pointer" }}>
                  {b.cover
                    ? <img src={b.cover} alt={b.title}
                        style={{ width:"100%", aspectRatio:"2/3", objectFit:"cover", borderRadius:3,
                          boxShadow:"2px 4px 9px rgba(0,0,0,0.6)" }} />
                    : <div style={{ width:"100%", aspectRatio:"2/3", borderRadius:3,
                        background:"linear-gradient(135deg,#22331f,#16251a)", display:"flex",
                        alignItems:"center", justifyContent:"center", fontSize:30, opacity:0.6,
                        boxShadow:"2px 4px 9px rgba(0,0,0,0.6)" }}>📗</div>}
                  <div style={{ fontSize:11, color:"#c9bb95", marginTop:5, lineHeight:1.25,
                    overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{b.title}</div>
                </div>
              ))}
            </div>
          )}
          {/* the wooden shelf board */}
          <div style={{ height:14, marginTop:4, marginBottom:18,
            background:"linear-gradient(180deg,#7a4f2a 0%,#5e3b20 55%,#3d2614 100%)",
            borderRadius:"2px 2px 4px 4px",
            boxShadow:"0 4px 8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(190,140,80,0.5)" }} />
        </div>
      );
    }

    // A labelled section that packs its books onto as many shelf rows as fit.
    function Shelf({ label, books, mode, onOpen }) {
      const ROW_H = mode === "spine" ? 190 : 175;
      const wrapRef = useRef(null);
      const [avail, setAvail] = useState(0);

      // Measure the real inner width of this shelf so rows pack accurately.
      useEffect(() => {
        const el = wrapRef.current;
        if (!el) return;
        const measure = () => setAvail(el.clientWidth);
        measure();
        let ro;
        if (typeof ResizeObserver !== "undefined") {
          ro = new ResizeObserver(measure);
          ro.observe(el);
        }
        window.addEventListener("resize", measure);
        window.addEventListener("orientationchange", measure);
        return () => {
          if (ro) ro.disconnect();
          window.removeEventListener("resize", measure);
          window.removeEventListener("orientationchange", measure);
        };
      }, []);

      // Pack books into rows using each book's actual rendered width.
      const rows = [];
      if (books.length) {
        const usable = Math.max(120, avail || 320);
        if (mode === "spine") {
          // bookends sit at both ends of every row
          const budget = usable - (BOOKEND_W * 2) - 6;
          let row = [], used = 0;
          for (const b of books) {
            const w = spineDims(b).w + SPINE_GAP;
            if (row.length && used + w > budget) { rows.push(row); row = []; used = 0; }
            row.push(b); used += w;
          }
          if (row.length) rows.push(row);
        } else {
          const per = Math.max(1, Math.floor((usable + COVER_GAP) / (COVER_W + COVER_GAP)));
          for (let i = 0; i < books.length; i += per) rows.push(books.slice(i, i + per));
        }
      }

      return (
        <div style={{ marginBottom: 22 }}>
          {/* brass label plate */}
          <div style={{ display:"flex", justifyContent:"center", marginBottom:-1 }}>
            <div style={{
              background:"linear-gradient(180deg,#4a3a1c,#2e2412)",
              border:"1px solid #6b5426", borderRadius:4,
              padding:"3px 16px", color:"#e0c983", fontSize:11, fontWeight:700,
              letterSpacing:"0.14em", textTransform:"uppercase",
              fontFamily:"Georgia, serif", boxShadow:"0 2px 4px rgba(0,0,0,0.4)",
            }}>{label}{books.length ? ` · ${books.length}` : ""}</div>
          </div>
          <div ref={wrapRef} style={{
            background:"linear-gradient(180deg, rgba(10,20,14,0.55), rgba(6,12,9,0.75))",
            border:"1px solid #2a3f2f", borderTop:"none",
            borderRadius:"0 0 6px 6px", padding:"12px 10px 0",
            overflow:"hidden",
          }}>
            {books.length === 0 ? (
              <div>
                <div style={{ color:"#5d7263", fontSize:13, textAlign:"center", padding:"18px 0 22px", fontStyle:"italic" }}>
                  Empty shelf
                </div>
                <div style={{ height:14, marginTop:4, marginBottom:4,
                  background:"linear-gradient(180deg,#7a4f2a 0%,#5e3b20 55%,#3d2614 100%)",
                  borderRadius:"2px 2px 4px 4px",
                  boxShadow:"0 4px 8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(190,140,80,0.5)" }} />
              </div>
            ) : rows.map((row, i) => (
              <ShelfRow key={i} books={row} mode={mode} onOpen={onOpen}
                rowHeight={ROW_H} showEnds={mode === "spine"} />
            ))}
          </div>
        </div>
      );
    }

    // ── Spine capture: guided camera frame, or crop an existing photo ─────────
    function SpineCapture({ onDone, onCancel }) {
      const [stage, setStage] = useState("choose");   // choose | camera | crop
      const [imgSrc, setImgSrc] = useState(null);
      const [err, setErr] = useState("");
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const boxRef = useRef(null);          // the visible camera/crop area
      const fileRef = useRef(null);
      const imgRef = useRef(null);
      // crop box in container coordinates
      const [crop, setCrop] = useState({ x: 0, y: 0, w: 0, h: 0 });
      const drag = useRef(null);

      const stopCam = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
      };
      useEffect(() => stopCam, []);

      const startCam = async () => {
        setErr(""); setStage("camera");
        try {
          const s = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width:{ideal:1920}, height:{ideal:1080} },
            audio: false,
          });
          streamRef.current = s;
          setTimeout(() => {
            if (videoRef.current) { videoRef.current.srcObject = s; videoRef.current.play(); }
          }, 50);
        } catch (e) {
          setErr("Camera unavailable. Allow camera access in Settings, or pick a photo instead.");
          setStage("choose");
        }
      };

      // The guide frame, as a fraction of the visible box.
      const GUIDE = { wf: 0.20, hf: 0.78 };

      const captureFromVideo = () => {
        const v = videoRef.current, box = boxRef.current;
        if (!v || !box || !v.videoWidth) return;
        const dispW = box.clientWidth, dispH = box.clientHeight;
        const vw = v.videoWidth, vh = v.videoHeight;
        // video is rendered with object-fit: cover
        const scale = Math.max(dispW / vw, dispH / vh);
        const offX = (dispW - vw * scale) / 2;
        const offY = (dispH - vh * scale) / 2;
        // guide rect in container coords
        const gw = dispW * GUIDE.wf, gh = dispH * GUIDE.hf;
        const gx = (dispW - gw) / 2, gy = (dispH - gh) / 2;
        // map back to source pixels
        const sx = (gx - offX) / scale, sy = (gy - offY) / scale;
        const sw = gw / scale, sh = gh / scale;
        const out = document.createElement("canvas");
        const targetH = 900;
        out.height = targetH;
        out.width = Math.max(40, Math.round(targetH * (sw / sh)));
        out.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, out.width, out.height);
        stopCam();
        onDone(out.toDataURL("image/jpeg", 0.88));
      };

      const pickFile = (file) => {
        if (!file) return;
        const r = new FileReader();
        r.onload = (e) => { setImgSrc(e.target.result); setStage("crop"); };
        r.readAsDataURL(file);
      };

      // Once the image is laid out, seed a sensible spine-shaped crop box.
      const onImgLoad = () => {
        const box = boxRef.current;
        if (!box) return;
        const W = box.clientWidth, H = box.clientHeight;
        const w = Math.min(W * 0.26, H * 0.20);
        const h = Math.min(H * 0.80, w * 6.5);
        setCrop({ x: (W - w) / 2, y: (H - h) / 2, w, h });
      };

      const pt = (e) => {
        const t = e.touches ? e.touches[0] : e;
        const r = boxRef.current.getBoundingClientRect();
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      };
      const startDrag = (mode) => (e) => {
        e.preventDefault();
        drag.current = { mode, start: pt(e), orig: { ...crop } };
      };
      const onMove = (e) => {
        if (!drag.current) return;
        e.preventDefault();
        const p = pt(e), d = drag.current;
        const W = boxRef.current.clientWidth, H = boxRef.current.clientHeight;
        const dx = p.x - d.start.x, dy = p.y - d.start.y;
        if (d.mode === "move") {
          setCrop(c => ({ ...c,
            x: Math.max(0, Math.min(W - c.w, d.orig.x + dx)),
            y: Math.max(0, Math.min(H - c.h, d.orig.y + dy)) }));
        } else {
          setCrop(c => ({ ...c,
            w: Math.max(24, Math.min(W - c.x, d.orig.w + dx)),
            h: Math.max(60, Math.min(H - c.y, d.orig.h + dy)) }));
        }
      };
      const endDrag = () => { drag.current = null; };

      const confirmCrop = () => {
        const im = imgRef.current, box = boxRef.current;
        if (!im || !box) return;
        const dispW = box.clientWidth, dispH = box.clientHeight;
        const iw = im.naturalWidth, ih = im.naturalHeight;
        // image is rendered with object-fit: contain
        const scale = Math.min(dispW / iw, dispH / ih);
        const offX = (dispW - iw * scale) / 2;
        const offY = (dispH - ih * scale) / 2;
        const sx = Math.max(0, (crop.x - offX) / scale);
        const sy = Math.max(0, (crop.y - offY) / scale);
        const sw = Math.min(iw - sx, crop.w / scale);
        const sh = Math.min(ih - sy, crop.h / scale);
        const out = document.createElement("canvas");
        const targetH = 900;
        out.height = targetH;
        out.width = Math.max(40, Math.round(targetH * (sw / sh)));
        out.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, out.width, out.height);
        onDone(out.toDataURL("image/jpeg", 0.88));
      };

      const btn = { padding:"12px 18px", borderRadius:12, fontWeight:700, fontSize:15, cursor:"pointer" };

      return (
        <div style={{ position:"fixed", inset:0, background:"#07100c", zIndex:200,
          display:"flex", flexDirection:"column", color:"#efe6d2",
          fontFamily:"'Inter',system-ui,sans-serif" }}>
          <div style={{ padding:"52px 20px 14px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <span style={{ fontSize:17, fontWeight:700, fontFamily:"Georgia, serif" }}>
              {stage === "crop" ? "Crop the spine" : "Scan a spine"}
            </span>
            <button onClick={() => { stopCam(); onCancel(); }}
              style={{ ...btn, background:"#24382b", border:"1px solid #33513c", color:"#efe6d2", padding:"8px 16px", fontSize:14 }}>
              Cancel
            </button>
          </div>

          {err && <div style={{ color:"#e07a6a", fontSize:13, textAlign:"center", padding:"0 20px 10px" }}>{err}</div>}

          {stage === "choose" && (
            <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"center",
              alignItems:"center", gap:14, padding:"0 30px" }}>
              <div style={{ fontSize:52 }}>📖</div>
              <p style={{ fontSize:14, color:"#a8b5a5", textAlign:"center", lineHeight:1.6, maxWidth:340 }}>
                Line the book's spine up inside the frame, or pick a photo you've already taken and crop it.
              </p>
              <button onClick={startCam}
                style={{ ...btn, background:"linear-gradient(135deg,#3d6b45,#2b5133)", border:"1px solid #57804f", color:"#f0e7cf", width:"100%", maxWidth:320 }}>
                📷 Use Camera
              </button>
              <button onClick={() => fileRef.current.click()}
                style={{ ...btn, background:"#1b3024", border:"1px solid #33513c", color:"#d9c47e", width:"100%", maxWidth:320 }}>
                🖼 Choose from Photos
              </button>
              <input ref={fileRef} type="file" accept="image/*" style={{ display:"none" }}
                onChange={e => pickFile(e.target.files[0])} />
            </div>
          )}

          {stage === "camera" && (
            <div style={{ flex:1, display:"flex", flexDirection:"column" }}>
              <div ref={boxRef} style={{ flex:1, position:"relative", overflow:"hidden", background:"#000" }}>
                <video ref={videoRef} playsInline muted
                  style={{ width:"100%", height:"100%", objectFit:"cover" }} />
                {/* dimmed surround + bright guide frame */}
                <div style={{ position:"absolute", inset:0, pointerEvents:"none",
                  display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <div style={{
                    width:`${GUIDE.wf*100}%`, height:`${GUIDE.hf*100}%`,
                    border:"3px solid #d9c47e", borderRadius:4,
                    boxShadow:"0 0 0 9999px rgba(0,0,0,0.55)",
                  }} />
                </div>
              </div>
              <div style={{ padding:"16px 20px 30px", textAlign:"center" }}>
                <div style={{ fontSize:13, color:"#a8b5a5", marginBottom:12 }}>
                  Fill the frame with the spine, hold steady
                </div>
                <button onClick={captureFromVideo}
                  style={{ ...btn, background:"linear-gradient(135deg,#3d6b45,#2b5133)", border:"1px solid #57804f", color:"#f0e7cf", width:"100%", maxWidth:320 }}>
                  Capture Spine
                </button>
              </div>
            </div>
          )}

          {stage === "crop" && (
            <div style={{ flex:1, display:"flex", flexDirection:"column" }}>
              <div ref={boxRef}
                onMouseMove={onMove} onMouseUp={endDrag} onMouseLeave={endDrag}
                onTouchMove={onMove} onTouchEnd={endDrag}
                style={{ flex:1, position:"relative", overflow:"hidden", background:"#000", touchAction:"none" }}>
                <img ref={imgRef} src={imgSrc} alt="" onLoad={onImgLoad}
                  style={{ width:"100%", height:"100%", objectFit:"contain" }} />
                <div onMouseDown={startDrag("move")} onTouchStart={startDrag("move")}
                  style={{ position:"absolute", left:crop.x, top:crop.y, width:crop.w, height:crop.h,
                    border:"3px solid #d9c47e", borderRadius:3,
                    boxShadow:"0 0 0 9999px rgba(0,0,0,0.55)", cursor:"move", touchAction:"none" }}>
                  <div onMouseDown={startDrag("size")} onTouchStart={startDrag("size")}
                    style={{ position:"absolute", right:-16, bottom:-16, width:34, height:34,
                      borderRadius:"50%", background:"#d9c47e", border:"2px solid #7a5f22",
                      cursor:"nwse-resize", touchAction:"none" }} />
                </div>
              </div>
              <div style={{ padding:"16px 20px 30px", textAlign:"center" }}>
                <div style={{ fontSize:13, color:"#a8b5a5", marginBottom:12 }}>
                  Drag to move · drag the gold circle to resize
                </div>
                <button onClick={confirmCrop}
                  style={{ ...btn, background:"linear-gradient(135deg,#3d6b45,#2b5133)", border:"1px solid #57804f", color:"#f0e7cf", width:"100%", maxWidth:320 }}>
                  Use This Spine
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [books, setBooks]           = useState([]);
      const [view, setView]             = useState("library");
      const [selected, setSelected]     = useState(null);
      const [scanning, setScanning]     = useState(false);
      const [scanMsg, setScanMsg]       = useState("Looking up book…");
      const [scanError, setScanError]   = useState("");
      const [form, setForm]             = useState({ ...emptyBook });
      const [previewImg, setPreviewImg] = useState(null);
      const [filter, setFilter]         = useState("All");
      const [searchQ, setSearchQ]       = useState("");
      const [scanningBarcode, setScanningBarcode] = useState(false);
      const [syncCode, setSyncCode] = useState(() => localStorage.getItem("myshelf_synccode") || "");
      const [syncCodeInput, setSyncCodeInput] = useState("");
      const [syncStatus, setSyncStatus] = useState(""); // "", "syncing", "synced", "offline"
      const [shelfMode, setShelfMode] = useState(() => localStorage.getItem("myshelf_mode") || "spine");
      const coverRef  = useRef();
      const [spineCapture, setSpineCapture] = useState(false);
      const barcodeScannerRef = useRef(null);
      const saveTimer = useRef(null);

      // Load: pull from cloud first (if we have a sync code), fall back to local.
      useEffect(() => {
        const local = localStorage.getItem(STORAGE_KEY);
        if (local) { try { setBooks(JSON.parse(local)); } catch {} }
        if (syncCode) {
          setSyncStatus("syncing");
          fetch(`/api/load?syncCode=${encodeURIComponent(syncCode)}`)
            .then(r => r.json())
            .then(data => {
              if (data && Array.isArray(data.books)) {
                setBooks(data.books);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data.books));
                setSyncStatus("synced");
              }
            })
            .catch(() => setSyncStatus("offline"));
        }
      }, []);

      // Save: always save locally now; push to cloud (debounced) if we have a code.
      const saveBooks = (updated) => {
        setBooks(updated);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(updated)); }
        catch { alert("Couldn't save — device storage is full. Try removing a book."); }
        if (syncCode) {
          setSyncStatus("syncing");
          if (saveTimer.current) clearTimeout(saveTimer.current);
          saveTimer.current = setTimeout(() => {
            fetch("/api/save", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ syncCode, books: updated }),
            })
              .then(r => r.json())
              .then(res => setSyncStatus(res && res.ok ? "synced" : "offline"))
              .catch(() => setSyncStatus("offline"));
          }, 600);
        }
      };

      // Connect a sync code: save it, then pull any existing cloud data.
      const connectSync = () => {
        const code = syncCodeInput.trim().toLowerCase();
        if (code.length < 4) { alert("Sync code must be at least 4 characters."); return; }
        localStorage.setItem("myshelf_synccode", code);
        setSyncCode(code);
        setSyncCodeInput("");
        setSyncStatus("syncing");
        fetch(`/api/load?syncCode=${encodeURIComponent(code)}`)
          .then(r => r.json())
          .then(data => {
            if (data && Array.isArray(data.books) && data.books.length > 0) {
              // Merge cloud books with any local-only ones (by id).
              setBooks(prev => {
                const byId = {};
                [...data.books, ...prev].forEach(b => { byId[b.id] = byId[b.id] || b; });
                const merged = Object.values(byId);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
                // Push the merged set back up so both devices match.
                fetch("/api/save", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ syncCode: code, books: merged }),
                }).catch(() => {});
                return merged;
              });
            } else {
              // No cloud data yet — push whatever we have locally.
              setBooks(prev => {
                fetch("/api/save", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ syncCode: code, books: prev }),
                }).catch(() => {});
                return prev;
              });
            }
            setSyncStatus("synced");
          })
          .catch(() => setSyncStatus("offline"));
      };

      const disconnectSync = () => {
        localStorage.removeItem("myshelf_synccode");
        setSyncCode("");
        setSyncStatus("");
      };

      // ── Cover photo (view only, no scan) ─────────────────────────────────────
      const handleCoverPhoto = async (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
          const thumb = await resizeImage(e.target.result, 400);
          setForm(f => ({ ...f, cover: thumb }));
          setPreviewImg(thumb);
        };
        reader.readAsDataURL(file);
      };

      // ── Barcode scan → ISBN lookup ───────────────────────────────────────────
      const handleISBNFound = async (isbn) => {
        setScanError("");
        setScanMsg("Looking up book…");
        setScanning(true);
        try {
          const details = await lookupByISBN(isbn);
          let cover = details.cover || null;
          if (cover) { const r = await resizeImage(cover, 400); cover = r || cover; }
          delete details.cover;
          setForm(f => ({ ...f, ...details, cover: cover || f.cover, id: f.id }));
          if (cover) setPreviewImg(cover);
        } catch (err) {
          setScanError("Barcode lookup failed: " + (err.message || "Unknown error"));
        } finally {
          setScanning(false);
        }
      };

      const startBarcodeScan = () => {
        setScanError("");
        setScanningBarcode(true);
        setTimeout(async () => {
          // Prefer ZXing (more reliable for book barcodes on iPad Safari).
          if (window.ZXing && window.ZXing.BrowserMultiFormatReader) {
            try {
              const hints = new Map();
              const reader = new ZXing.BrowserMultiFormatReader(hints, 300);
              barcodeScannerRef.current = { type: "zxing", reader };
              await reader.decodeFromConstraints(
                { video: { facingMode: "environment" } },
                "zxing-video",
                (result, err) => {
                  if (result) {
                    const text = result.getText ? result.getText() : result.text;
                    if (text) { stopBarcodeScan(); handleISBNFound(text); }
                  }
                }
              );
              return;
            } catch (e) {
              // fall through to html5-qrcode
            }
          }
          // Fallback: html5-qrcode
          try {
            const scanner = new Html5Qrcode("barcode-reader", {
              experimentalFeatures: { useBarCodeDetectorIfSupported: true },
            });
            barcodeScannerRef.current = { type: "h5", scanner };
            await scanner.start(
              { facingMode: "environment" },
              { fps: 20, qrbox: { width: 320, height: 200 }, aspectRatio: 1.7 },
              async (decoded) => { await stopBarcodeScan(); handleISBNFound(decoded); },
              () => {}
            );
          } catch {
            setScanningBarcode(false);
            setScanError("Camera access failed. Allow camera in Settings.");
          }
        }, 150);
      };

      const stopBarcodeScan = async () => {
        const ref = barcodeScannerRef.current;
        if (ref) {
          try {
            if (ref.type === "zxing") { ref.reader.reset(); }
            else if (ref.type === "h5") { await ref.scanner.stop(); ref.scanner.clear(); }
          } catch {}
          barcodeScannerRef.current = null;
        }
        setScanningBarcode(false);
      };

      const startAdd = () => { setForm({ ...emptyBook, id: Date.now(), addedAt: new Date().toISOString() }); setPreviewImg(null); setScanError(""); setView("add"); };
      const saveBook = () => {
        if (!form.title.trim()) return;
        const idx = books.findIndex(b => b.id === form.id);
        const updated = idx >= 0 ? books.map(b => b.id === form.id ? form : b)
          : [{ ...form, addedAt: form.addedAt || new Date().toISOString() }, ...books];
        saveBooks(updated); setView("library");
      };
      const deleteBook = (id) => { saveBooks(books.filter(b => b.id !== id)); setView("library"); };
      const openDetail = (book) => { setSelected(book); setView("detail"); };
      const editBook   = (book) => { setForm({ ...book }); setPreviewImg(book.cover || null); setScanError(""); setView("add"); };
      const setStatus  = (book, status) => { saveBooks(books.map(b => b.id === book.id ? { ...b, status } : b)); setSelected({ ...book, status }); };

      const statuses = ["All", "Unread", "Reading", "Finished"];
      const filtered = books.filter(b => {
        const matchStatus = filter === "All" || b.status === filter;
        const q = searchQ.toLowerCase();
        return matchStatus && (!q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q));
      });
      const counts = { All: books.length,
        "Unread": books.filter(b => b.status==="Unread").length,
        "Reading": books.filter(b => b.status==="Reading").length,
        "Finished": books.filter(b => b.status==="Finished").length };

      const inp = { width:"100%", background:"#14251b", border:"1px solid #2c4433",
        borderRadius:10, padding:"10px 14px", color:"#efe6d2", fontSize:14, outline:"none", boxSizing:"border-box" };
      const lbl = { fontSize:12, fontWeight:600, color:"#a68f5b", textTransform:"uppercase",
        letterSpacing:"0.08em", marginBottom:6, display:"block", marginTop:16 };
      const btnSec = { background:"#1b3024", border:"1px solid #33513c", borderRadius:12,
        padding:11, color:"#d9c47e", fontWeight:600, fontSize:13, cursor:"pointer" };

      // ── Detail ──────────────────────────────────────────────────────────────
      if (view === "detail" && selected) {
        const book = books.find(b => b.id === selected.id) || selected;
        return (
          <div style={{ position:"fixed", inset:0, background:"#0d1712", overflowY:"auto", fontFamily:"'Inter',system-ui,sans-serif", color:"#efe6d2" }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, padding:"52px 20px 16px", borderBottom:"1px solid #2a3f2f" }}>
              <button onClick={() => setView("library")} style={{ background:"none", border:"none", color:"#d9c47e", fontSize:22, cursor:"pointer" }}>←</button>
              <span style={{ fontSize:18, fontWeight:700 }}>Book Details</span>
            </div>
            {book.cover
              ? <img src={book.cover} alt={book.title} style={{ width:"100%", maxHeight:300, objectFit:"contain", background:"#14251b" }} />
              : <div style={{ width:"100%", height:180, background:"#14251b", display:"flex", alignItems:"center", justifyContent:"center", fontSize:72 }}>📚</div>}
            <div style={{ padding:"24px 20px 80px" }}>
              <div style={{ fontSize:24, fontWeight:800, lineHeight:1.2, marginBottom:6 }}>{book.title||"Untitled"}</div>
              <div style={{ fontSize:16, color:"#bda97a", marginBottom:16 }}>{book.author||"Unknown Author"}</div>

              {/* Status switcher */}
              <div style={{ display:"flex", gap:8, marginBottom:20 }}>
                {["Unread","Reading","Finished"].map(s => (
                  <button key={s} onClick={() => setStatus(book, s)}
                    style={{ flex:1, padding:"8px 4px", borderRadius:10, fontSize:12, fontWeight:700, cursor:"pointer",
                      background: book.status===s ? "#3d6b45" : "#16261c",
                      color: book.status===s ? "#fff" : "#9090b0",
                      border: `1px solid ${book.status===s ? "#57804f" : "#2a3f2f"}` }}>{s}</button>
                ))}
              </div>

              <div style={{ marginBottom:20 }}><StarRating value={book.rating} onChange={r => { saveBooks(books.map(b => b.id===book.id?{...b,rating:r}:b)); setSelected({...book,rating:r}); }} /></div>

              {book.description && <p style={{ fontSize:14, color:"#a8b5a5", lineHeight:1.6, marginBottom:20 }}>{book.description}</p>}
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:20 }}>
                {[["Pages",book.pages],["Year",book.year],["Genre",book.genre],["Publisher",book.publisher]].map(([label,val]) =>
                  val ? <div key={label} style={{ background:"#14251b", border:"1px solid #2a3f2f", borderRadius:12, padding:"12px 14px" }}>
                    <div style={{ fontSize:11, color:"#7f9285", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:4 }}>{label}</div>
                    <div style={{ fontSize:15, fontWeight:600 }}>{val}</div>
                  </div> : null)}
                {book.isbn && <div style={{ background:"#14251b", border:"1px solid #2a3f2f", borderRadius:12, padding:"12px 14px", gridColumn:"1/-1" }}>
                  <div style={{ fontSize:11, color:"#7f9285", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:4 }}>ISBN</div>
                  <div style={{ fontSize:15, fontWeight:600 }}>{book.isbn}</div>
                </div>}
              </div>
              <div style={{ display:"flex", gap:10 }}>
                <button onClick={() => editBook(book)} style={{ flex:1, background:"#1b3024", border:"1px solid #33513c", borderRadius:12, padding:12, color:"#d9c47e", fontWeight:700, fontSize:14, cursor:"pointer" }}>✏️ Edit</button>
                <button onClick={() => deleteBook(book.id)} style={{ flex:1, background:"#301a1a", border:"1px solid #5c2a2a", borderRadius:12, padding:12, color:"#f87171", fontWeight:700, fontSize:14, cursor:"pointer" }}>🗑 Delete</button>
              </div>
            </div>
          </div>
        );
      }

      // ── Add / Edit ───────────────────────────────────────────────────────────
      if (view === "add") return (
        <div style={{ position:"fixed", inset:0, background:"#0d1712", overflowY:"auto", fontFamily:"'Inter',system-ui,sans-serif", color:"#efe6d2", paddingBottom:80 }}>
          {spineCapture && (
            <SpineCapture
              onCancel={() => setSpineCapture(false)}
              onDone={(img) => { setForm(f => ({ ...f, spineImage: img })); setSpineCapture(false); }}
            />
          )}
          {scanningBarcode && (
            <div style={{ position:"fixed", inset:0, background:"#000", zIndex:100, display:"flex", flexDirection:"column" }}>
              <div style={{ padding:"52px 20px 16px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <span style={{ fontSize:16, fontWeight:700, color:"#fff" }}>Point camera at barcode</span>
                <button onClick={stopBarcodeScan} style={{ background:"#24382b", border:"none", borderRadius:10, padding:"8px 16px", color:"#fff", fontWeight:600, fontSize:14, cursor:"pointer" }}>Cancel</button>
              </div>
              <div id="barcode-reader" style={{ width:"100%", flex:1, position:"relative", overflow:"hidden" }}>
                <video id="zxing-video" style={{ width:"100%", height:"100%", objectFit:"cover" }} muted playsInline></video>
              </div>
              <div style={{ padding:20, textAlign:"center", color:"#a8b5a5", fontSize:13 }}>Line up the barcode — hold steady</div>
            </div>
          )}
          <div style={{ display:"flex", alignItems:"center", gap:12, padding:"52px 20px 16px", borderBottom:"1px solid #2a3f2f" }}>
            <button onClick={() => setView("library")} style={{ background:"none", border:"none", color:"#d9c47e", fontSize:22, cursor:"pointer" }}>←</button>
            <span style={{ fontSize:18, fontWeight:700 }}>{form.id && books.find(b => b.id === form.id) ? "Edit Book" : "Add Book"}</span>
          </div>
          <div style={{ padding:"20px 20px 0" }}>
            <div style={{ width:"100%", height:200, borderRadius:16, overflow:"hidden", background:"#14251b",
              border:"2px dashed #2a2a50", display:"flex", alignItems:"center", justifyContent:"center",
              marginBottom:12, position:"relative" }}>
              {previewImg
                ? <img src={previewImg} alt="cover" style={{ width:"100%", height:"100%", objectFit:"contain" }} />
                : <div style={{ textAlign:"center" }}>
                    <div style={{ fontSize:40, marginBottom:8 }}>📚</div>
                    <div style={{ fontSize:13, color:"#7f9285" }}>Scan a barcode to auto-fill</div>
                  </div>}
              {scanning && (
                <div style={{ position:"absolute", inset:0, background:"rgba(13,13,26,0.9)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:10 }}>
                  <div style={{ fontSize:28 }}>🔍</div>
                  <div style={{ color:"#d9c47e", fontWeight:600, fontSize:14 }}>{scanMsg}</div>
                </div>)}
            </div>
            {scanError && <div style={{ color:"#f87171", fontSize:13, marginBottom:8, textAlign:"center" }}>{scanError}</div>}

            <button onClick={startBarcodeScan} style={{ ...btnSec, width:"100%", marginBottom:8, background:"linear-gradient(135deg,#3d6b45,#2b5133)", color:"#fff", border:"none", fontSize:15, padding:13 }}>
              📊 Scan Barcode
            </button>
            <button onClick={async () => {
              const entered = prompt("Enter the ISBN (the number under the barcode, e.g. 9781743312629):");
              if (entered && entered.replace(/[^0-9Xx]/g, "").length >= 10) {
                await handleISBNFound(entered);
              } else if (entered) {
                setScanError("That doesn't look like a valid ISBN.");
              }
            }} style={{ ...btnSec, width:"100%", marginBottom:8 }}>
              🔢 Search by ISBN
            </button>
            <button onClick={() => coverRef.current.click()} style={{ ...btnSec, width:"100%", marginBottom:8 }}>
              📷 Add / Change Cover Photo
            </button>
            <input ref={coverRef} type="file" accept="image/*" style={{ display:"none" }} onChange={e => handleCoverPhoto(e.target.files[0])} />

            <button onClick={() => setSpineCapture(true)} style={{ ...btnSec, width:"100%", marginBottom:4 }}>
              📖 {form.spineImage ? "Rescan Spine Photo" : "Scan Spine Photo"}
            </button>
            {form.spineImage && (
              <div style={{ display:"flex", alignItems:"center", gap:12, marginTop:10,
                background:"#14251b", border:"1px solid #2a3f2f", borderRadius:10, padding:"10px 12px" }}>
                <img src={form.spineImage} alt="spine"
                  style={{ width:26, height:104, objectFit:"cover", borderRadius:2,
                    boxShadow:"2px 3px 7px rgba(0,0,0,0.55)" }} />
                <div style={{ flex:1, fontSize:12, color:"#a8b5a5", lineHeight:1.5 }}>
                  This photo will be used on the shelf instead of a generated spine.
                </div>
                <button onClick={() => setForm(f => ({ ...f, spineImage: null }))}
                  style={{ background:"#301a1a", border:"1px solid #5c2a2a", borderRadius:9,
                    padding:"7px 11px", color:"#e07a6a", fontWeight:700, fontSize:12, cursor:"pointer" }}>
                  Remove
                </button>
              </div>
            )}
          </div>
          <div style={{ padding:"0 20px" }}>
            {[["Title *","title","Book title"],["Author","author","Author name"],
              ["Genre","genre","e.g. Fiction, Self-Help"],["Publisher","publisher","Publisher"],["ISBN","isbn","ISBN"]].map(([label,key,ph]) => (
              <div key={key}>
                <label style={lbl}>{label}</label>
                <input style={inp} value={form[key]} placeholder={ph} onChange={e => setForm({...form,[key]:e.target.value})} />
              </div>))}
            <div style={{ display:"flex", gap:12 }}>
              {[["Pages","pages","e.g. 320"],["Year","year","e.g. 2023"]].map(([label,key,ph]) => (
                <div key={key} style={{ flex:1 }}>
                  <label style={lbl}>{label}</label>
                  <input style={inp} value={form[key]} placeholder={ph} onChange={e => setForm({...form,[key]:e.target.value})} />
                </div>))}
            </div>
            <label style={lbl}>Description</label>
            <textarea style={{ ...inp, resize:"vertical", minHeight:80 }} value={form.description} placeholder="Synopsis or notes" onChange={e => setForm({...form,description:e.target.value})} />
            <label style={lbl}>Reading Status</label>
            <select style={inp} value={form.status} onChange={e => setForm({...form,status:e.target.value})}>
              {["Unread","Reading","Finished"].map(s => <option key={s}>{s}</option>)}
            </select>
            <label style={lbl}>Your Rating</label>
            <StarRating value={form.rating} onChange={r => setForm({...form,rating:r})} />
          </div>
          <button onClick={saveBook} disabled={!form.title.trim()}
            style={{ position:"fixed", bottom:20, left:20, right:20, zIndex:20,
              background: form.title.trim() ? "linear-gradient(135deg,#3d6b45,#2b5133)" : "#2a2a45",
              color:"#fff", border:"none", borderRadius:14, padding:14, fontWeight:700, fontSize:16,
              cursor: form.title.trim() ? "pointer" : "not-allowed" }}>Save Book</button>
        </div>
      );

      // ── Sync settings screen ──────────────────────────────────────────────────
      if (view === "sync") {
        const statusText = {
          "": "Not connected",
          "syncing": "Syncing…",
          "synced": "✓ Synced",
          "offline": "Offline — will sync when online",
        }[syncStatus] || "";
        return (
          <div style={{ position:"fixed", inset:0, background:"#0d1712", overflowY:"auto", fontFamily:"'Inter',system-ui,sans-serif", color:"#efe6d2" }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, padding:"52px 20px 16px", borderBottom:"1px solid #2a3f2f" }}>
              <button onClick={() => setView("library")} style={{ background:"none", border:"none", color:"#d9c47e", fontSize:22, cursor:"pointer" }}>←</button>
              <span style={{ fontSize:18, fontWeight:700 }}>Sync</span>
            </div>
            <div style={{ padding:"24px 20px" }}>
              <p style={{ fontSize:14, color:"#a8b5a5", lineHeight:1.6, marginBottom:24 }}>
                Enter the same sync code on your iPhone and iPad to keep your books in sync across both devices. Choose any private phrase you'll remember.
              </p>
              {syncCode ? (
                <div>
                  <div style={{ background:"#14251b", border:"1px solid #2a3f2f", borderRadius:12, padding:"16px", marginBottom:16 }}>
                    <div style={{ fontSize:11, color:"#7f9285", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:6 }}>Connected as</div>
                    <div style={{ fontSize:18, fontWeight:700, marginBottom:8 }}>{syncCode}</div>
                    <div style={{ fontSize:13, color: syncStatus==="synced" ? "#4ade80" : "#a090c0" }}>{statusText}</div>
                  </div>
                  <button onClick={disconnectSync} style={{ width:"100%", background:"#301a1a", border:"1px solid #5c2a2a", borderRadius:12, padding:13, color:"#f87171", fontWeight:700, fontSize:14, cursor:"pointer" }}>
                    Disconnect this device
                  </button>
                  <p style={{ fontSize:12, color:"#7f9285", marginTop:12, lineHeight:1.5 }}>
                    Disconnecting keeps your books on this device but stops syncing. Your cloud copy is untouched.
                  </p>
                </div>
              ) : (
                <div>
                  <label style={{ ...lbl, marginTop:0 }}>Your sync code</label>
                  <input value={syncCodeInput} onChange={e => setSyncCodeInput(e.target.value)}
                    placeholder="e.g. james-books-2025"
                    autoCapitalize="none" autoCorrect="off"
                    style={{ ...inp, marginBottom:12 }} />
                  <button onClick={connectSync} disabled={syncCodeInput.trim().length < 4}
                    style={{ width:"100%", background: syncCodeInput.trim().length>=4 ? "linear-gradient(135deg,#3d6b45,#2b5133)" : "#2a2a45", color:"#fff", border:"none", borderRadius:12, padding:14, fontWeight:700, fontSize:16, cursor: syncCodeInput.trim().length>=4 ? "pointer" : "not-allowed" }}>
                    Connect & Sync
                  </button>
                  <p style={{ fontSize:12, color:"#7f9285", marginTop:12, lineHeight:1.5 }}>
                    Tip: use something private but memorable. Anyone who enters the same code sees the same shelf.
                  </p>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ── Library (bookcase) ────────────────────────────────────────────────────
      const syncDot = { "syncing":"#d9b64e", "synced":"#7fc98d", "offline":"#e07a6a", "":"#6b7d6f" }[syncStatus] || "#6b7d6f";
      const q = searchQ.toLowerCase();
      const matches = b => !q || (b.title||"").toLowerCase().includes(q) || (b.author||"").toLowerCase().includes(q);
      // Sort by author surname, then title.
      const surname = (a) => {
        const parts = (a || "").trim().split(/\s+/);
        return (parts.length > 1 ? parts[parts.length - 1] : (a || "")).toLowerCase();
      };
      const byAuthor = (x, y) => {
        const s = surname(x.author).localeCompare(surname(y.author));
        if (s !== 0) return s;
        return (x.title || "").localeCompare(y.title || "");
      };
      const reading  = books.filter(b => b.status === "Reading"  && matches(b)).sort(byAuthor);
      const unread   = books.filter(b => b.status === "Unread"   && matches(b)).sort(byAuthor);
      const finished = books.filter(b => b.status === "Finished" && matches(b)).sort(byAuthor);

      return (
        <div style={{ minHeight:"100vh", color:"#efe6d2", fontFamily:"'Inter',system-ui,sans-serif", paddingBottom:80,
          background:"radial-gradient(ellipse at 50% 0%, #1c3325 0%, #12211a 45%, #0b1410 100%)" }}>

          <div style={{ padding:"52px 20px 0", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ fontSize:24, fontWeight:700, letterSpacing:"0.02em", fontFamily:"Georgia, serif" }}>
              my<span style={{ color:"#d9c47e" }}>shelf</span>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <button onClick={() => setView("sync")} title="Sync"
                style={{ background:"#1b3024", border:"1px solid #33513c", borderRadius:12, padding:"10px 12px", color:"#d9c47e", fontWeight:600, fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
                <span style={{ width:8, height:8, borderRadius:99, background:syncDot, display:"inline-block" }}></span>
                🔄
              </button>
              <button onClick={startAdd}
                style={{ background:"linear-gradient(135deg,#3d6b45,#2b5133)", color:"#f0e7cf", border:"1px solid #57804f", borderRadius:12, padding:"10px 18px", fontWeight:600, fontSize:14, cursor:"pointer" }}>+ Add Book</button>
            </div>
          </div>

          <input placeholder="Search by title or author…" value={searchQ} onChange={e => setSearchQ(e.target.value)}
            style={{ ...inp, margin:"16px 20px 0", width:"calc(100% - 40px)" }} />

          {/* spine / cover toggle */}
          <div style={{ display:"flex", justifyContent:"center", gap:0, margin:"14px 20px 20px" }}>
            {[["spine","Spines"],["cover","Covers"]].map(([m,label]) => (
              <button key={m} onClick={() => { setShelfMode(m); localStorage.setItem("myshelf_mode", m); }}
                style={{
                  background: shelfMode===m ? "linear-gradient(180deg,#4a3a1c,#2e2412)" : "#16261c",
                  color: shelfMode===m ? "#e0c983" : "#7f9285",
                  border:"1px solid #4a3a1c",
                  borderRadius: m==="spine" ? "8px 0 0 8px" : "0 8px 8px 0",
                  padding:"7px 22px", fontSize:12, fontWeight:700, letterSpacing:"0.08em",
                  textTransform:"uppercase", cursor:"pointer", fontFamily:"Georgia, serif",
                }}>{label}</button>
            ))}
          </div>

          <div style={{ padding:"0 10px" }}>
            {books.length === 0 ? (
              <div style={{ textAlign:"center", padding:"70px 40px" }}>
                <div style={{ fontSize:56, marginBottom:16 }}>📚</div>
                <div style={{ fontSize:18, fontWeight:700, marginBottom:8, fontFamily:"Georgia, serif" }}>Your bookcase is empty</div>
                <div style={{ fontSize:14, color:"#7f9285" }}>Tap + Add Book and scan a barcode</div>
              </div>
            ) : (
              <div>
                <Shelf label="Currently Reading" books={reading}  mode={shelfMode} onOpen={openDetail} />
                <Shelf label="To Read"           books={unread}   mode={shelfMode} onOpen={openDetail} />
                <Shelf label="Finished"          books={finished} mode={shelfMode} onOpen={openDetail} />
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    // Register service worker for offline support.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
